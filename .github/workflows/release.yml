name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (default: version.hpp)"
        required: false
        type: string
      publish:
        description: "Also create/update the release and push the container image"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  NFPM_VERSION: "2.48.0"

jobs:
  # Resolve the version once; decide whether this run publishes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            [ -n "$V" ] || V=$(sed -n 's/^#define SLAPLOG_VERSION "\(.*\)"/\1/p' version.hpp)
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Build the baseline binary on AlmaLinux 9 (glibc 2.34), natively per arch.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            simd: -march=x86-64-v2
          - arch: arm64
            runner: ubuntu-24.04-arm
            simd: -march=armv8-a
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in AlmaLinux 9
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e SIMD_FLAGS="${{ matrix.simd }}" \
            almalinux:9 bash -c '
              set -e
              dnf install -y -q epel-release
              dnf install -y -q gcc-c++ make git tar gzip bzip2 xz diffutils \
                pcre2-devel zlib-devel bzip2-devel xz-devel json-devel time python3
              make -j"$(nproc)" SIMD_FLAGS="$SIMD_FLAGS"
              make check
            '
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Stage the tarball
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist "stage/slaplog-$VERSION-linux-${{ matrix.arch }}"
          cp slaplog "dist/slaplog-linux-${{ matrix.arch }}"
          cp slaplog LICENSE README.md CHANGELOG.md \
             "stage/slaplog-$VERSION-linux-${{ matrix.arch }}/"
          cp doc/slaplog.md "stage/slaplog-$VERSION-linux-${{ matrix.arch }}/"
          tar -C stage -czf "dist/slaplog-$VERSION-linux-${{ matrix.arch }}.tar.gz" \
              "slaplog-$VERSION-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: slaplog-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Wrap the two binaries into .deb and .rpm with nfpm.
  package:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install nfpm
        run: |
          curl -sSL -o nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf nfpm.tgz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
      - name: Build .deb and .rpm
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          for a in amd64 arm64; do
            case "$a" in
              amd64) D=amd64; R=x86_64 ;;
              arm64) D=arm64; R=aarch64 ;;
            esac
            rm -rf pkgroot
            mkdir -p pkgroot/doc
            cp "dist/slaplog-linux-$a" pkgroot/slaplog
            cp LICENSE README.md CHANGELOG.md pkgroot/
            cp doc/slaplog.md pkgroot/doc/
            (cd pkgroot && PKG_VERSION="$VERSION" PKG_ARCH="$D" \
              nfpm package -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" -p deb -t "$GITHUB_WORKSPACE/dist/")
            (cd pkgroot && PKG_VERSION="$VERSION" PKG_ARCH="$R" \
              nfpm package -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" -p rpm -t "$GITHUB_WORKSPACE/dist/")
          done
          (cd dist && sha256sum ./*.tar.gz ./*.deb ./*.rpm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error

  # Attach the packages to the release (creating it from the CHANGELOG if needed).
  publish:
    needs: [version, package]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            python3 packaging/changelog-section.py \
              "${{ needs.version.outputs.version }}" > /tmp/notes.md
            gh release create "$TAG" \
              --title "slaplog ${{ needs.version.outputs.version }}" \
              --notes-file /tmp/notes.md
          fi
          gh release upload "$TAG" dist/* --clobber

  # Multi-arch runtime image from the binaries built above.
  container:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/zx97/slaplog:${{ needs.version.outputs.version }}
            ghcr.io/zx97/slaplog:latest
