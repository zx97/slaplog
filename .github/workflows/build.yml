name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libpcre2-dev zlib1g-dev libbz2-dev liblzma-dev \
            python3 nlohmann-json3-dev time
      - name: Build and run the native test suite
        run: make -j"$(nproc)" check
