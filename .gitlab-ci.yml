anonymity:
  image: python:3
  script:
    - python3 tools/check_anonymity.py

build:
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libpcre2-dev
      zlib1g-dev libbz2-dev liblzma-dev python3 nlohmann-json3-dev git gawk time
  script:
    - make -j"$(nproc)" check

# ---------------------------------------------------------------------------
# Release artefacts (tag only)
# ---------------------------------------------------------------------------
# The binary is built on AlmaLinux 9 (glibc 2.34 baseline) so the tarball and
# the packages run on Debian 12+, Ubuntu 22.04+ and RHEL 9+.  The GitHub
# workflow (release.yml) builds both architectures; GitLab builds amd64 and
# publishes the artefacts to the Generic Package Registry.
package:
  stage: deploy
  image: almalinux:9
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - dnf install -y -q epel-release
    - dnf install -y -q gcc-c++ make git tar gzip bzip2 xz diffutils
      pcre2-devel zlib-devel bzip2-devel xz-devel json-devel time python3 curl
  script:
    - make -j"$(nproc)" SIMD_FLAGS="-march=x86-64-v2"
    - make check
    - VERSION="${CI_COMMIT_TAG#v}"
    - mkdir -p dist pkgroot/doc "stage/slaplog-$VERSION-linux-amd64"
    - cp slaplog dist/slaplog-linux-amd64
    - cp slaplog LICENSE README.md CHANGELOG.md "stage/slaplog-$VERSION-linux-amd64/"
    - cp doc/slaplog.md "stage/slaplog-$VERSION-linux-amd64/"
    - tar -C stage -czf "dist/slaplog-$VERSION-linux-amd64.tar.gz" "slaplog-$VERSION-linux-amd64"
    - cp slaplog pkgroot/slaplog
    - cp LICENSE README.md CHANGELOG.md pkgroot/
    - cp doc/slaplog.md pkgroot/doc/
    - curl -sSL -o nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
    - tar -xzf nfpm.tgz nfpm
    - install -m 0755 nfpm /usr/local/bin/nfpm
    - (cd pkgroot && PKG_VERSION="$VERSION" PKG_ARCH=amd64 nfpm package -f "$CI_PROJECT_DIR/packaging/nfpm.yaml" -p deb -t "$CI_PROJECT_DIR/dist/")
    - (cd pkgroot && PKG_VERSION="$VERSION" PKG_ARCH=x86_64 nfpm package -f "$CI_PROJECT_DIR/packaging/nfpm.yaml" -p rpm -t "$CI_PROJECT_DIR/dist/")
    - (cd dist && sha256sum ./*.tar.gz ./*.deb ./*.rpm > SHA256SUMS)
    - |
      for f in dist/*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/slaplog/$VERSION/$(basename "$f")"
      done
  artifacts:
    paths:
      - dist/
    expire_in: never

# Container image from the package job's binary, pushed to the project registry.
container-image:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: package
      artifacts: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      docker build --build-arg TARGETARCH=amd64 --build-arg VERSION="$VERSION"
      -t "$CI_REGISTRY_IMAGE:$VERSION" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"
